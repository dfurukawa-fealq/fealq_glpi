# GLPI 11 routes plugin PHP files through public/index.php.
# Only static plugin assets are exposed directly from compatible plugin directories.
Alias /plugins/brandkit/generated /var/glpi/files/_plugins/brandkit
# Token-protected DashGLPI import bridges used by the standalone dashboard container.
Alias /plugins/dashglpi/ajax/computer_config.php /var/www/glpi/plugins/dashglpi/ajax/computer_config.php
Alias /plugins/dashglpi/ajax/monitor_config.php /var/www/glpi/plugins/dashglpi/ajax/monitor_config.php
Alias /plugins/dashglpi/ajax/ticket_import_config.php /var/www/glpi/plugins/dashglpi/ajax/ticket_import_config.php
AliasMatch "^/plugins/(brandkit|addressing|dashglpi)/(.*\.(?:css|js|json|webmanifest|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot|map))$" "/var/www/glpi/plugins/$1/$2"

<Directory /var/www/glpi/plugins>
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<Directory /var/glpi/files/_plugins/brandkit>
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
