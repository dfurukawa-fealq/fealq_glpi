  # ----------------------------------------
  # NETWORK LAYER - External (Pre-created)
  # ----------------------------------------
  # Network must exist BEFORE deployment.
  # Selected mode: automatic/default Docker IPs.
  # Existing network confirmed by operator.
  # ----------------------------------------
networks:
  fealq-network:
    external: true
    name: ${DOCKER_NETWORK_NAME:-fealq-network}
