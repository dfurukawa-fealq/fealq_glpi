#======================================================
# Docker Compose configuration for GLPI application
# Version: 3.8
# Author: WDS -
#======================================================

services:
  glpi:
    build:
      context: .
      dockerfile: Dockerfile.glpi
      args:
        GLPI_VERSION: ${GLPI_VERSION:-11.0.8}
    container_name: ${CONTAINER_NAME}
    hostname: ${CONTAINER_NAME}
    restart: unless-stopped
    environment:
      GLPI_DB_HOST: ${GLPI_DB_HOST}
      GLPI_DB_PORT: ${GLPI_DB_PORT:-3306}
      GLPI_DB_NAME: ${GLPI_DB_NAME}
      GLPI_DB_USER: ${GLPI_DB_USER}
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD}
      TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
      GLPI_SKIP_AUTOINSTALL: ${GLPI_SKIP_AUTOINSTALL:-false}
      DASHGLPI_BRIDGE_TOKEN: ${DASHGLPI_BRIDGE_TOKEN:-change-this-bridge-token}
    volumes:
      - glpi_data:/var/glpi
    ports:
      - "${GLPI_PORT}:${GLPI_CONTAINER_PORT}"
    networks:
      - ${DOCKER_NETWORK_NAME}

  dashglpi:
    build:
      context: ./Apps/dashglpi
      dockerfile: Dockerfile
    container_name: ${DASHGLPI_CONTAINER_NAME:-dashglpi-app}
    hostname: ${DASHGLPI_CONTAINER_NAME:-dashglpi-app}
    restart: unless-stopped
    environment:
      GLPI_DB_HOST: ${GLPI_DB_HOST}
      GLPI_DB_PORT: ${GLPI_DB_PORT:-3306}
      GLPI_DB_NAME: ${GLPI_DB_NAME}
      GLPI_DB_USER: ${GLPI_DB_USER}
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD}
      DASHGLPI_AUTH_USER: ${DASHGLPI_AUTH_USER:-admin}
      DASHGLPI_AUTH_PASSWORD: ${DASHGLPI_AUTH_PASSWORD:-change-me}
      GLPI_PUBLIC_URL: ${GLPI_PUBLIC_URL:-}
      DASHGLPI_PUBLIC_URL: ${DASHGLPI_PUBLIC_URL:-}
      DASHGLPI_PUSH_ENABLED: ${DASHGLPI_PUSH_ENABLED:-true}
      DASHGLPI_PUSH_VAPID_SUBJECT: ${DASHGLPI_PUSH_VAPID_SUBJECT:-}
      DASHGLPI_PUSH_VAPID_PUBLIC_KEY: ${DASHGLPI_PUSH_VAPID_PUBLIC_KEY:-}
      DASHGLPI_PUSH_VAPID_PRIVATE_KEY: ${DASHGLPI_PUSH_VAPID_PRIVATE_KEY:-}
      GLPI_FILES_DIR: ${GLPI_FILES_DIR:-/var/glpi/files}
      DASHGLPI_ADMIN_USERS: ${DASHGLPI_ADMIN_USERS:-admin}
      DASHGLPI_BRIDGE_URL: ${DASHGLPI_BRIDGE_URL:-http://glpi/plugins/dashglpi/ajax/sla_config.php}
      DASHGLPI_BRIDGE_TOKEN: ${DASHGLPI_BRIDGE_TOKEN:-change-this-bridge-token}
      DASHGLPI_SQL_WRITE_ENABLED: ${DASHGLPI_SQL_WRITE_ENABLED:-false}
      # Canais de mensageria (fallback; a UI de Canais de Alerta sobrepõe via settings
      # do plugin) — mesmas variáveis já passadas ao dashglpi-worker abaixo, para que
      # o botão "Testar"/"testar destinatário" também funcione via .env sem precisar
      # salvar antes pela tela (dashglpi_alerting_config() faz esse fallback em ambos).
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://kawa_evolutionapi:8080}
      EVOLUTION_API_INSTANCE: ${EVOLUTION_API_INSTANCE:-}
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      N8N_ALERT_WEBHOOK_URL: ${N8N_ALERT_WEBHOOK_URL:-}
      TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
      TZ: ${TIMEZONE:-America/Sao_Paulo}
    volumes:
      - glpi_data:/var/glpi:ro
    ports:
      - "${DASHGLPI_PORT:-8086}:80"
    depends_on:
      - glpi
    networks:
      - ${DOCKER_NETWORK_NAME}

  # Motor de SLA ativo (Step 5): agendador próprio, desacoplado do cron do GLPI.
  # Reaproveita o código do dashglpi rodando como worker CLI em loop.
  dashglpi-worker:
    build:
      context: ./Apps/dashglpi
      dockerfile: Dockerfile.worker
    container_name: ${DASHGLPI_WORKER_CONTAINER_NAME:-kawa_dashglpi_worker}
    hostname: ${DASHGLPI_WORKER_CONTAINER_NAME:-kawa_dashglpi_worker}
    restart: unless-stopped
    environment:
      GLPI_DB_HOST: ${GLPI_DB_HOST}
      GLPI_DB_PORT: ${GLPI_DB_PORT:-3306}
      GLPI_DB_NAME: ${GLPI_DB_NAME}
      GLPI_DB_USER: ${GLPI_DB_USER}
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD}
      GLPI_PUBLIC_URL: ${GLPI_PUBLIC_URL:-}
      DASHGLPI_PUBLIC_URL: ${DASHGLPI_PUBLIC_URL:-}
      DASHGLPI_PUSH_ENABLED: ${DASHGLPI_PUSH_ENABLED:-true}
      DASHGLPI_PUSH_VAPID_SUBJECT: ${DASHGLPI_PUSH_VAPID_SUBJECT:-}
      DASHGLPI_PUSH_VAPID_PUBLIC_KEY: ${DASHGLPI_PUSH_VAPID_PUBLIC_KEY:-}
      DASHGLPI_PUSH_VAPID_PRIVATE_KEY: ${DASHGLPI_PUSH_VAPID_PRIVATE_KEY:-}
      DASHGLPI_TICKET_URL_TEMPLATE: ${DASHGLPI_TICKET_URL_TEMPLATE:-}
      SLA_WORKER_INTERVAL: ${SLA_WORKER_INTERVAL:-60}
      # Canais de mensageria (fallback; a UI sobrepõe via settings do plugin)
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://kawa_evolutionapi:8080}
      EVOLUTION_API_INSTANCE: ${EVOLUTION_API_INSTANCE:-}
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      N8N_ALERT_WEBHOOK_URL: ${N8N_ALERT_WEBHOOK_URL:-}
      TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
      TZ: ${TIMEZONE:-America/Sao_Paulo}
    depends_on:
      - glpi
    networks:
      - ${DOCKER_NETWORK_NAME}
